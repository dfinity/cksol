[book]
title = "ckSOL"
description = "Documentation for ckSOL, a chain-key token on the Internet Computer backed 1:1 by SOL."
authors = ["DFINITY"]
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/dfinity/cksol"
edit-url-template = "https://github.com/dfinity/cksol/edit/main/docs/{path}"
# The book is served from https://dfinity.github.io/cksol/, so the 404 page must
# load its assets from /cksol/ rather than from the domain root.
site-url = "/cksol/"
no-section-label = true
additional-js = ["mermaid-init.js"]

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
